<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I love you ❤️</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0f0000; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="heart"></canvas>
<script>
const canvas = document.getElementById('heart');
const ctx = canvas.getContext('2d');
let W, H, dpr, particles = [], floaters = [], frame = 0;
const colors = ['#ff1414', '#dc143c', '#ff0000', '#b22222', '#ff3c3c'];
const words = ['i love you', 'I LOVE YOU', 'love you'];
const floatWords = ['love', '♥', 'love you', '❤'];

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  makeParticles();
}
function heartPoint(t) {
  const x = 16 * Math.sin(t) ** 3;
  const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
  const scale = Math.min(W / 42, H / 34, 20);
  return [W/2 + x*scale, H/2 - y*scale - H*0.035];
}
function makeParticles() {
  particles = [];
  const n = 160;
  for (let i=0; i<n; i++) {
    const t = i/n * Math.PI*2, [x,y] = heartPoint(t);
    particles.push({x,y, delay:i*0.6, word:words[Math.floor(Math.random()*words.length)],
      color:colors[Math.floor(Math.random()*colors.length)], size:12+Math.random()*4,
      alpha:0, phase:Math.random()*Math.PI*2, outline:true});
  }
  let attempts = 0;
  while (particles.length < 290 && attempts < 7000) {
    attempts++;
    const t = Math.random()*Math.PI*2, r = Math.sqrt(Math.random())*0.84;
    const [cx,cy] = heartPoint(t);
    const [x,y] = [W/2+(cx-W/2)*r, H/2+(cy-H/2)*r];
    if (particles.some(p => Math.hypot(p.x-x,p.y-y)<(W<500?17:24))) continue;
    particles.push({x,y, delay:115+Math.random()*55, word:words[Math.floor(Math.random()*words.length)],
      color:colors[Math.floor(Math.random()*colors.length)], size:10+Math.random()*4,
      alpha:0, phase:Math.random()*Math.PI*2, outline:false});
  }
  floaters = Array.from({length: Math.min(100, Math.floor(W*H/11000))}, makeFloater);
  frame = 0;
}
function makeFloater() {
  return {x:Math.random()*W, y:Math.random()*H, word:floatWords[Math.floor(Math.random()*floatWords.length)],
    color:colors[Math.floor(Math.random()*colors.length)], size:10+Math.random()*8,
    alpha:20+Math.random()*65, vx:(Math.random()-.5)*.35, vy:-.25-Math.random()*.7,
    phase:Math.random()*Math.PI*2};
}
function drawGlowText(text, x, y, color, alpha, size, glow=true) {
  ctx.save();
  ctx.globalAlpha = Math.max(0, Math.min(1, alpha/255));
  ctx.font = `bold ${size}px Arial, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (glow) { ctx.shadowColor = color; ctx.shadowBlur = size*1.15; }
  ctx.fillStyle = color; ctx.fillText(text, x, y);
  ctx.restore();
}
function animate() {
  frame++;
  ctx.fillStyle = 'rgba(15,0,0,0.32)';
  ctx.fillRect(0,0,W,H);
  // floating words/hearts
  for (const f of floaters) {
    f.x += f.vx + Math.sin(frame*.018+f.phase)*.25;
    f.y += f.vy;
    if (f.y < -25) { f.y=H+20; f.x=Math.random()*W; }
    drawGlowText(f.word,f.x,f.y,f.color,f.alpha,f.size,false);
  }
  for (const p of particles) {
    if (frame > p.delay) p.alpha = Math.min(255, p.alpha + 9);
    const flicker = p.alpha >= 255 ? .78 + .22*Math.sin(frame*.04+p.phase) : 1;
    if (p.alpha > 0) drawGlowText(p.word,p.x,p.y,p.color,p.alpha*flicker,p.size,true);
  }
  if (frame > 220) {
    const alpha = Math.min(255,(frame-220)*9);
    const pulse = 1 + .025*Math.sin(frame*.05);
    const size = Math.min(W*.075, 42)*pulse;
    drawGlowText('I Love you',W/2,H/2,size>0?'#ffc8c8':'#ffc8c8',alpha,size,true);
  }
  requestAnimationFrame(animate);
}
window.addEventListener('resize', resize);
resize();
ctx.fillStyle = '#0f0000'; ctx.fillRect(0,0,W,H);
animate();
</script>
</body>
</html>
